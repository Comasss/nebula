[package]
name = "nebula"
version = "1.5.5"
description = "Nebula — a modern Usenet (NZB) client for Windows and Android"
authors = ["Genis"]
edition = "2021"

[lib]
name = "nebula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "multipart", "stream"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
roxmltree = "0.20"
crc32fast = "1"
parking_lot = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
flate2 = "1"
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.55"
clipboard-win = "5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# Android no trae OpenSSL: se compila junto a la app.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
